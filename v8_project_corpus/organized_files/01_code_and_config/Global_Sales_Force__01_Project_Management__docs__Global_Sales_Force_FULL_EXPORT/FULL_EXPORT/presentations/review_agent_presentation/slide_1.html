<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        .slide-container { 
            width: 1280px; 
            min-height: 720px; 
            background-color: #0A192F; 
            font-family: 'Inter', sans-serif;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        
        /* Decorative Elements */
        .accent-line {
            width: 150px;
            height: 8px;
            background-color: #00B4D8;
            margin-bottom: 40px;
            border-radius: 4px;
        }
        
        .bg-shape-1 {
            position: absolute;
            top: -100px;
            right: -100px;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(0,180,216,0.1) 0%, rgba(10,25,47,0) 70%);
            z-index: 1;
        }
        
        .bg-shape-2 {
            position: absolute;
            bottom: -150px;
            left: -100px;
            width: 600px;
            height: 600px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(0,180,216,0.05) 0%, rgba(10,25,47,0) 70%);
            z-index: 1;
        }

        /* Content Containers */
        .content-wrapper {
            z-index: 2;
            text-align: center;
            max-width: 1000px;
        }

        h1 {
            color: #FFFFFF;
            font-size: 84px;
            font-weight: 800;
            line-height: 1.1;
            margin-bottom: 24px;
            letter-spacing: -1px;
        }

        h2 {
            color: #00B4D8;
            font-size: 36px;
            font-weight: 600;
            line-height: 1.3;
            margin-bottom: 60px;
        }

        .context-badge {
            display: inline-block;
            background-color: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 16px 32px;
            border-radius: 50px;
            color: #F8F9FA;
            font-size: 20px;
            font-weight: 400;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>
    <div class="slide-container">
        <div class="bg-shape-1"></div>
        <div class="bg-shape-2"></div>
        
        <div class="content-wrapper">
            <div style="display: flex; justify-content: center;">
                <div class="accent-line"></div>
            </div>
            <h1>The Automated Review Agent</h1>
            <h2>Turning 100 GBP Locations Into a Review-Generating Machine</h2>
            <div class="context-badge">
                Global Sales Force — 19 Brands, 100+ Locations
            </div>
        </div>
    </div>
</body>
</html>
